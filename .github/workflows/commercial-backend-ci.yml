name: Commercial Backend CI

on:
  push:
    branches:
      - deploy/liara-commercial-sandbox
      - hardening/p0-p1-release-integrity-20260920
  pull_request:
    branches:
      - deploy/liara-commercial-sandbox
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkhorse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d darkhorse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/darkhorse_ci
      APP_ENV: staging
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
      BILLING_PROVIDER: mock
      OTP_PROVIDER: mock
      ALLOW_RUNTIME_SCHEMA_BOOTSTRAP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application
        run: python -c "from main_v2 import app; assert app.title == 'Dark Horse API V2.0'; print('APP_IMPORT=PASS')"

      - name: Apply Alembic schema
        run: alembic upgrade head

      - name: Verify runtime schema bootstrap is fail-closed
        run: |
          python - <<'PY'
          from database import init_db
          try:
              init_db()
          except RuntimeError as exc:
              assert "Alembic" in str(exc)
              print("RUNTIME_SCHEMA_BOOTSTRAP=OFF")
          else:
              raise SystemExit("runtime schema bootstrap unexpectedly enabled")
          PY

      - name: Reference-data integrity
        run: python test_reference_data_integrity.py

      - name: API smoke contracts
        run: python -m pytest -q           test_main_api_contract.py           test_commercial_api.py           test_billing_api.py           test_billing_credits.py           test_billing_models.py           test_p0_quota_consumption.py           test_password_reset_contract.py

