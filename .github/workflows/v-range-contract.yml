name: V range scoring contract
on:
  pull_request:
    paths:
      - dark_horse_engine_v2.py
      - test_v_range_norm.py
      - test_v_consumer_contract.py
      - test_reference_fail_closed_startup.py
      - main_v2.py
      - docs/app.js
      - tests/test_v_null_consumer.js
      - scripts/audit_v_range_norm.py
      - scripts/render_v_range_report.py
      - .github/workflows/v-range-contract.yml
  workflow_dispatch:
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_v_null_consumer.js
      - run: python -m unittest test_v_range_norm test_engine_psychometrics test_p0_s_score test_v_consumer_contract test_main_api_contract test_reference_fail_closed_startup -q
      - run: python scripts/audit_v_range_norm.py > v-range-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v-range-report
          path: v-range-report.json
