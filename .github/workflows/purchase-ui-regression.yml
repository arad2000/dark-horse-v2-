name: Purchase UI regression

on:
  push:
    branches:
      - main
      - deploy/liara-commercial-sandbox
  pull_request:
    branches:
      - main

jobs:
  purchase-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run purchase UI regression
        run: node tests/test_purchase_ui_fix.js
