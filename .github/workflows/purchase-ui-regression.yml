name: Purchase UI regression

on:
  push:
    branches:
      - main
      - deploy/liara-commercial-sandbox
  pull_request:
    branches:
      - main

jobs:
  purchase-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run purchase UI regression
        run: node tests/test_purchase_ui_fix.js

      - name: Run PWA immediate home startup regression
        run: node tests/test_pwa_boot_startup.js
      - name: Run quota double-consumption regression
        run: node tests/test_quota_enforcement_bridge.js
      - name: Run City of Dreams navigation quota guard E2E contract
        run: node tests/test_city_of_dreams_navigation_quota_guard.js
      - name: Run authenticated discovery request contract regression
        run: node tests/test_discovery_request_auth.js
      - name: Run charged journey session persistence regression
        run: node tests/test_charged_journey_session_persistence.js
      - name: Run admin credit grant UI regression
        run: node tests/test_admin_credit_grant_ui.js
      - name: Run admission chance UI regression
        run: node tests/test_admission_chance_ui.js
      - name: Run auth timeout and security contracts
        run: node tests/test_security_contracts.js
      - name: Run canonical value poles contract
        run: node tests/test_value_poles_contract.js
      - name: Run seamless stage navigation, Home return & standard UX contract
        run: node tests/test_navigation_resume_and_standard_ux.js
      - name: Run Yehooyi bottom navigation and home regressions
        run: |
          node tests/test_yehooyi_navigation.js
          node tests/test_yehooyi_static.js
          node tests/test_genz_native_home_v2.js
      - name: Run P0 server-authoritative quota gate E2E regression
        run: node tests/test_p0_server_authoritative_quota_gate.js

  catalog-motive-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enforce catalog alignment contract
        run: node tests/test_catalog_alignment.js
      - name: Enforce narrow-path and motive-code contracts
        run: node tests/test_motive_route_contracts.js
