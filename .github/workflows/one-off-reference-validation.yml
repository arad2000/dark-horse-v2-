name: One-off reference data validation

on:
  push:
    branches:
      - audit/run-reference-validation-20261027

permissions:
  contents: read

jobs:
  validate-reference-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage real reference JSON from this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference-json"
          cp majors_database_v2.json "$RUNNER_TEMP/reference-json/"
          cp school_branches_v2.json "$RUNNER_TEMP/reference-json/"
          cp micro_motives.json "$RUNNER_TEMP/reference-json/"
          cp value_poles_v2.json "$RUNNER_TEMP/reference-json/"
          cp docs/data/questions_v2.json "$RUNNER_TEMP/reference-json/questions_v2.json"
          cp docs/trait_map_v3.json "$RUNNER_TEMP/reference-json/trait_map_v3.json"
          echo "AUDIT_CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "DATA_FILE_SHA256:"
          sha256sum "$RUNNER_TEMP/reference-json/"*.json
          echo "DATA_COUNTS:"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'reference-json'
          for name in sorted(x.name for x in p.glob('*.json')):
              obj=json.loads((p/name).read_text(encoding='utf-8'))
              print(f"{name}: {len(obj) if hasattr(obj, '__len__') else 'n/a'}")
          PY
      - name: Preflight empty or malformed strategy profiles
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'reference-json'/'majors_database_v2.json'
          if not p.exists():
              print("MAJORS_JSON_NOT_STAGED")
              raise SystemExit(0)
          data=json.loads(p.read_text(encoding='utf-8'))
          empty=[(m.get('id'),m.get('name'),len(m.get('strategy_weights') or [])) for m in data if not m.get('strategy_weights')]
          print(f"EMPTY_OR_MISSING_STRATEGY_WEIGHTS={len(empty)}")
          for mid,name,n in empty[:100]:
              print(f"  id={mid!r} name={name!r} rows={n}")
          PY
      - name: Run mandatory validate_integrity
        id: integrity
        if: always()
        shell: bash
        run: |
          python3 validate_integrity.py "$RUNNER_TEMP/reference-json"
      - name: Run global_separation diagnostic
        if: always()
        shell: bash
        run: |
          python3 global_separation_test.py "$RUNNER_TEMP/reference-json/majors_database_v2.json"
