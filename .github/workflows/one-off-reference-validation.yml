name: One-off reference data validation

on:
  push:
    branches:
      - audit/run-reference-validation-20261027

permissions:
  contents: read

jobs:
  validate-reference-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage real main reference JSON from this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/main-reference-json"
          cp majors_database_v2.json "$RUNNER_TEMP/main-reference-json/"
          cp school_branches_v2.json "$RUNNER_TEMP/main-reference-json/"
          cp micro_motives.json "$RUNNER_TEMP/main-reference-json/"
          cp value_poles_v2.json "$RUNNER_TEMP/main-reference-json/"
          cp docs/data/questions_v2.json "$RUNNER_TEMP/main-reference-json/questions_v2.json"
          cp docs/trait_map_v3.json "$RUNNER_TEMP/main-reference-json/trait_map_v3.json"
          echo "AUDIT_CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "MAIN_DATA_FILE_SHA256:"
          sha256sum "$RUNNER_TEMP/main-reference-json/"*.json
          echo "MAIN_DATA_COUNTS:"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'main-reference-json'
          for name in sorted(x.name for x in p.glob('*.json')):
              obj=json.loads((p/name).read_text(encoding='utf-8'))
              print(f"{name}: {len(obj) if hasattr(obj, '__len__') else 'n/a'}")
          PY
      - name: Preflight main empty or malformed strategy profiles
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'main-reference-json'/'majors_database_v2.json'
          if not p.exists():
              print("MAIN_MAJORS_JSON_NOT_STAGED")
              raise SystemExit(0)
          data=json.loads(p.read_text(encoding='utf-8'))
          empty=[(m.get('id'),m.get('name'),len(m.get('strategy_weights') or [])) for m in data if not m.get('strategy_weights')]
          print(f"MAIN_EMPTY_OR_MISSING_STRATEGY_WEIGHTS={len(empty)}")
          for mid,name,n in empty:
              print(f"  id={mid!r} name={name!r} rows={n}")
          PY
      - name: Run validate_integrity on main snapshot
        if: always()
        shell: bash
        run: |
          python3 validate_integrity.py "$RUNNER_TEMP/main-reference-json"
      - name: Run global_separation on main snapshot
        if: always()
        shell: bash
        run: |
          python3 global_separation_test.py "$RUNNER_TEMP/main-reference-json/majors_database_v2.json"
      - name: Checkout exact deploy HEAD for data comparison
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ed3a48ec99fe6a026351b6402a8c1878f1f6b12d
          path: deploy-snapshot
      - name: Stage real deploy HEAD reference JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy-reference-json"
          cp deploy-snapshot/majors_database_v2.json "$RUNNER_TEMP/deploy-reference-json/"
          cp deploy-snapshot/school_branches_v2.json "$RUNNER_TEMP/deploy-reference-json/"
          cp deploy-snapshot/micro_motives.json "$RUNNER_TEMP/deploy-reference-json/"
          cp deploy-snapshot/value_poles_v2.json "$RUNNER_TEMP/deploy-reference-json/"
          cp deploy-snapshot/docs/data/questions_v2.json "$RUNNER_TEMP/deploy-reference-json/questions_v2.json"
          cp deploy-snapshot/docs/trait_map_v3.json "$RUNNER_TEMP/deploy-reference-json/trait_map_v3.json"
          echo "DEPLOY_DATA_SNAPSHOT_SHA=ed3a48ec99fe6a026351b6402a8c1878f1f6b12d"
          echo "DEPLOY_DATA_FILE_SHA256:"
          sha256sum "$RUNNER_TEMP/deploy-reference-json/"*.json
          echo "DEPLOY_DATA_COUNTS:"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'deploy-reference-json'
          for name in sorted(x.name for x in p.glob('*.json')):
              obj=json.loads((p/name).read_text(encoding='utf-8'))
              print(f"{name}: {len(obj) if hasattr(obj, '__len__') else 'n/a'}")
          majors=json.loads((p/'majors_database_v2.json').read_text(encoding='utf-8'))
          branches=json.loads((p/'school_branches_v2.json').read_text(encoding='utf-8'))
          valid={'علوم تجربی','ریاضی فیزیک','علوم انسانی','فنی و حرفه‌ای'}
          driven=[m for m in majors if m.get('motive_driven') is True]
          assigned=[m for m in driven if m.get('high_school_branch') in valid]
          print(f"MOTIVE_DRIVEN_WITH_VALID_HIGH_SCHOOL_BRANCH={len(assigned)}/{len(driven)}")
          print(f"SOURCE_MAJORS_COUNT_SUM={sum(b.get('source_majors_count',0) for b in branches)}")
          PY
      - name: Run validate_integrity on deploy HEAD data
        if: always()
        shell: bash
        run: |
          python3 validate_integrity.py "$RUNNER_TEMP/deploy-reference-json"
      - name: Run global_separation on deploy HEAD data
        if: always()
        shell: bash
        run: |
          python3 global_separation_test.py "$RUNNER_TEMP/deploy-reference-json/majors_database_v2.json"
