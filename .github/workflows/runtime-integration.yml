name: Runtime Integration Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-runtime-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_dark_horse.db
      OTP_PROVIDER: mock
      OTP_EXPOSE_DEBUG_CODE: "true"
      BILLING_PROVIDER: mock
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_PRODUCTION_APPROVED: "false"
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run runtime contract tests
        run: >-
          pytest -q
          test_runtime_integration_contract.py
          test_commercial_runtime_flow.py
          test_frontend_runtime_contract.py
          test_kavenegar_otp_provider.py
