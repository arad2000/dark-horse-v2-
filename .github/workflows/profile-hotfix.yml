name: profile-hotfix
on:
  push:
    paths:
      - '.github/workflows/profile-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: deterministic profile tab boot lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shell boot lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/shell.js')
          s = p.read_text(encoding='utf-8')
          old = s
          pattern = re.compile(r"  function boot\(\) \{\n(.*?)\n  \}\n\n  window\.DHShell", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('boot function block not found')
          body = m.group(1)
          lines = body.splitlines()
          out = ['    if (window.__dhShellBooted) return;', '    window.__dhShellBooted = true;']
          skipping = False
          for line in lines:
              if line.startswith('    setTimeout(function () {') and ('renderHome();' in body):
                  skipping = True
              if skipping:
                  if line.strip().endswith('}, 200);') or line.strip().endswith('}, 700);'):
                      skipping = False
                  continue
              out.append(line)
          new_body = '\n'.join(out)
          s = s[:m.start(1)] + new_body + s[m.end(1):]
          s = re.sub(r"\n  setTimeout\(boot, 0\);\n", "\n", s, count=1)
          if s == old:
              raise SystemExit('no changes made')
          b = re.search(r'  function boot\(\) \{(.*?)\n  \}\n\n  window\.DHShell', s, re.S)
          if not b or 'setTimeout' in b.group(1) or b.group(1).count('renderHome();') != 1:
              raise SystemExit('boot verification failed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shell.js
          git diff --cached --check
          git commit -m 'fix: deterministic profile tab boot lifecycle'
          git push
