name: Liara Runtime Lock Audit

on:
  push:
    branches:
      - audit/dual-run-main-liara
  workflow_dispatch:

jobs:
  runtime-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live API root
        env:
          API_BASE: https://api.asbe-siah.ir
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20 -D root_headers.txt "$API_BASE/" -o root_body.json
          test "$(head -n 1 root_headers.txt | awk '{print $2}')" = "200"
          cat root_headers.txt
          cat root_body.json

      - name: Probe runtime fingerprint
        env:
          API_BASE: https://api.asbe-siah.ir
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 20 "$API_BASE/__runtime_fingerprint" -o runtime_fingerprint.json
          cat runtime_fingerprint.json

      - name: Build runtime lock report
        env:
          API_BASE: https://api.asbe-siah.ir
          DUAL_RUN_COMMIT: e33b7924b79b530df555c090df1c187b58cf5ab7
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path("root_body.json").read_text())
          fp = json.loads(Path("runtime_fingerprint.json").read_text())
          report = f"""Runtime lock report
- branch: deploy/liara-commercial-sandbox
- redeploy: unknown (Liara console is not connected to this audit)
- running: yes
- startup_ok: yes (live API root/fingerprint returned HTTP 200; startup log itself is not exposed here)
- runtime_commit_or_version: N/A (endpoint returns commit_hint={fp.get("commit_hint")!r}, not a commit SHA)
- dual_run_build_commit_tested: {__import__("os").environ["DUAL_RUN_COMMIT"]}
- match_claim:
  [x] build-level parity (already PASS)
  [ ] live process confirmed same commit/version
  [x] live process commit unknown (live endpoint responsive)
- notes: root={root}; fingerprint={json.dumps(fp, ensure_ascii=False)}
"""
          Path("runtime_lock_report.md").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Upload runtime lock report
        uses: actions/upload-artifact@v4
        with:
          name: liara-runtime-lock-report
          path: |
            runtime_lock_report.md
            root_body.json
            runtime_fingerprint.json
