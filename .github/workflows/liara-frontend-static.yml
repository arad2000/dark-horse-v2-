name: Liara public frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: liara-frontend-static
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.js; do node "$test"; done
          bash scripts/ci/check_no_public_sanjesh_dumps.sh .

      - name: Build public allowlist from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('scripts/frontend/public_allowlist.json').read_text())
          config['source_commit'] = os.environ['GITHUB_SHA']
          config['pages_workflow_run'] = None
          Path(os.environ['RUNNER_TEMP'], 'frontend-allowlist.json').write_text(json.dumps(config))
          PY
          python scripts/frontend/build_public_artifact.py \
            --allowlist "$RUNNER_TEMP/frontend-allowlist.json" \
            --output "$RUNNER_TEMP/liara-public"
          sha256sum "$RUNNER_TEMP/liara-public/index.html" "$RUNNER_TEMP/liara-public/app.js"

      # PRs only verify/build. The secret is never exposed to PR execution.
      - name: Check deployment credential
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$LIARA_API_TOKEN" ]; then
            echo '::error::Configure repository Actions secret LIARA_API_TOKEN before deployment.'
            exit 1
          fi

      - name: Install pinned Liara CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global @liara/cli@9.6.7

      - name: Deploy public frontend to existing Static app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/liara-public"
          liara deploy --app asbe-siah-web-test --platform static --path . \
            --api-token "$LIARA_API_TOKEN" --no-app-logs \
            --message "frontend main ${GITHUB_SHA}"
