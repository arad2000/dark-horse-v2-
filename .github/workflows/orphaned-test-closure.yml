name: Orphaned test closure

# These test files existed in the repository but no workflow ever ran them.
# They were verified green against the deploy branch before being added here,
# and they cover the psychometric engine, API security, exam-capacity data and
# runtime constraints. This job exists only to run them; it is additive and
# does not change any other workflow.
#
# IMPORTANT: this job is intentionally NOT "run everything with discover".
# A handful of older test files still pin dead frontend cache-buster versions
# or expect data that has since moved, so they fail for reasons unrelated to
# the code. Those are listed in KNOWN_STALE below and are run in
# non-blocking mode, so the debt stays visible without breaking the build.

on:
  push:
    branches:
      - deploy/liara-commercial-sandbox
  pull_request:
    branches:
      - main
      - deploy/liara-commercial-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orphaned-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dark_horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_horse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_test
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
      BILLING_PROVIDER: mock
      OTP_PROVIDER: mock
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply Alembic schema
        run: alembic upgrade head

      # ---- blocking: verified green, these must stay green ----
      - name: Psychometric engine contracts
        run: python -m unittest -v test_engine_psychometrics.py

      - name: API security and reliability contracts
        run: python -m unittest -v test_api_security_reliability.py

      - name: Exam capacity loaders (aggregate + ensani)
        run: |
          python -m unittest -v test_exam_capacity.py
          python -m unittest -v test_exam_capacity_ensani.py

      - name: Runtime and deployment constraints
        run: |
          python -m unittest -v test_runtime_constraints.py
          python -m unittest -v test_backend_build_smoke.py

      - name: CORS origin contract
        run: python -m unittest -v test_cors_origin_config.py

      - name: Quota health migration contract
        run: python -m unittest -v test_quota_health_migration.py

      - name: Frontend and journey contracts
        run: |
          python -m unittest -v test_admission_chance_ui_contract.py
          python -m unittest -v test_auth_runtime_guard.py
          python -m unittest -v test_motive_driven_discovery_guard.py
          python -m unittest -v test_password_reset_mount.py
          python -m unittest -v test_phase3_city_paths.py

      - name: Reference data mapping contracts
        run: |
          python -m unittest -v test_record_major_map.py
          python -m unittest -v test_record_table5_bomi.py

      - name: Request validation contract
        run: python -m unittest -v test_v_request_validation.py

      # ---- non-blocking: known stale, kept visible on purpose ----
      - name: Known-stale tests (reported, does not block)
        continue-on-error: true
        run: |
          set +e
          failed=""
          for t in \
            test_auth_frontend_p0.py \
            test_frontend_billing_admin_sandbox_contract.py \
            test_pwa_auth_cache_contract.py \
            test_release_hotfix_contract.py \
            test_exam_capacity_honar.py \
            test_exam_capacity_riazi.py \
            test_exam_capacity_tajrobi.py \
            test_exam_capacity_zaban.py
          do
            echo "----------------------------------------------------------"
            echo "known-stale: $t"
            python -m unittest "$t" || failed="$failed $t"
          done
          echo "=========================================================="
          if [ -n "$failed" ]; then
            echo "KNOWN-STALE FAILURES (expected, not blocking):$failed"
            printf '%s\n' "$failed" | tr ' ' '\n' | grep . > known_stale_failures.txt
          fi
          exit 0

      - name: Summarize known-stale debt
        continue-on-error: true
        run: |
          if [ -s known_stale_failures.txt ]; then
            echo "### Known-stale test debt" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These files still need repair; they are excluded from the blocking step:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat known_stale_failures.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All known-stale tests now pass — remove them from the non-blocking step and promote them." >> "$GITHUB_STEP_SUMMARY"
          fi
