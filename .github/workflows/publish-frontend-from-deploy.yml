name: Publish frontend from main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify publish artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/data.js
          test -f docs/data/micro_motives.json
          grep -q 'SPORT-' docs/data.js
          grep -q 'ARCHY-' docs/data.js
          grep -q 'history-meaning-text' docs/data.js
          grep -q 'data.js?v=phase3-161-176-1' docs/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/data/micro_motives.json").read_text(encoding="utf-8"))
          assert len(data) >= 1211, len(data)
          sport = [x for x in data if str(x.get("code", "")).startswith("SPORT-")]
          assert len(sport) >= 7, len(sport)
          assert any(x.get("code") == "SPORT-001" for x in sport)
          print(f"micro_motives_count={len(data)} sport_count={len(sport)}")
          PY

      - name: Verify admission major catalog contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("docs/majors_catalog_ui_v1.json").read_text(encoding="utf-8"))
          majors = catalog["majors"]
          ids = [int(item["id"]) for item in majors]
          names = [str(item.get("name") or "").strip() for item in majors]
          assert len(majors) == 204, len(majors)
          assert ids == list(range(1, 205)), (ids[:3], ids[-3:])
          assert all(names), "Every UI catalog major must have a name"
          assert len(names) == len(set(names)), "UI catalog contains duplicate names"
          assert catalog["source_ref"] == "deploy/liara-commercial-sandbox"
          assert catalog["source_sha"] == "84d0658ff3d1990e38ba5bcfcb46eb54f7f403f7"
          print(f"ui_catalog_count={len(majors)} source_sha={catalog['source_sha']}")
          PY

      - name: Verify artifact layout
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/data.js
          test -f docs/data/micro_motives.json
          ! test -f data.js
          ! test -f data/micro_motives.json

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
