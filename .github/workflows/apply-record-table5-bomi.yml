name: Apply record table5 bomi patch

on:
  push:
    branches:
      - feat/record-table5-bomi-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply table5 mapping
        run: |
          set -e
          if git log -1 --format=%B | grep -q '\[record-table5-applied\]'; then
            echo "Already applied; exiting."
            exit 0
          fi

          python - <<'PY'
          import json
          import unicodedata
          from pathlib import Path

          program_path = Path("program2s.json")
          majors = json.loads(Path("majors_database_v2.json").read_text(encoding="utf-8"))
          table = json.loads(Path("docs/sanjesh_table5_major_bomi_v1.json").read_text(encoding="utf-8"))
          data = json.loads(program_path.read_text(encoding="utf-8"))
          programs = data["programs"] if isinstance(data, dict) else data

          def norm(value):
              text = unicodedata.normalize("NFKC", str(value or ""))
              text = text.replace("ي", "ی").replace("ى", "ی").replace("ك", "ک").replace("\u200c", " ")
              return " ".join(text.split()).strip()

          id_to_name = {str(x["id"]): str(x.get("name") or "").strip() for x in majors if isinstance(x, dict) and x.get("id") is not None}
          daily = table.get("daily_major_bomi") or {}
          aliases = table.get("name_aliases") or {}
          lookup = {norm(k): v for k, v in daily.items()}
          for alias, target in aliases.items():
              if target in daily:
                  lookup[norm(alias)] = daily[target]

          before = {"ostani": 0, "nahiyei": 0, "ghotbi": 0, "keshvari": 0, "null": 0}
          after = {"ostani": 0, "nahiyei": 0, "ghotbi": 0, "keshvari": 0, "null": 0}
          changed = unresolved = count = 0

          for p in programs:
              a = p.get("admission_info") or {}
              if a.get("method") != "سوابق تحصیلی" or a.get("course_type") != "savabegh_dolati":
                  continue
              count += 1
              old = a.get("bomi_type") or None
              before[old if old in before else "null"] += 1
              name = id_to_name.get(str(p.get("major_id")))
              new = (lookup.get(norm(name)) if name else None) or None
              changed += old != new
              unresolved += new is None
              a["bomi_type"] = new
              a["bomi_type_rule"] = "table5.daily_major_bomi" if new else "unresolved_table5"
              after[new or "null"] += 1


          program_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("SAVABEGH_DOLATI_COUNT=", count)
          print("BEFORE=", before)
          print("AFTER=", after)
          print("CHANGED=", changed)
          print("UNRESOLVED_TABLE5=", unresolved)
          PY

      - name: Regression tests
        run: python -m unittest -v test_record_table5_bomi.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program2s.json
          git commit -m "Apply table5 bomi mapping to savabegh programs [record-table5-applied]"
          git push origin "HEAD:$GITHUB_REF_NAME"
