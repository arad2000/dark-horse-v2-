name: Hybrid Reconciled Audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - integration/hybrid-reconciled

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkhorse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d darkhorse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/darkhorse_test
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
      BILLING_PROVIDER: mock
      OTP_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate migration head
        run: alembic heads
      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head
      - name: Migration current
        run: alembic current
      - name: Quota and migration contracts
        run: python -m pytest -q test_quota_persistence_contract.py test_hybrid_reconciliation_contract.py
      - name: Verify cutover remains disabled
        run: |
          python - <<'PY'
          import os
          assert os.getenv("POSTGRES_RUNTIME_CUTOVER_APPROVED", "false").lower() == "false"
          assert os.getenv("DARK_HORSE_SHADOW_PERSISTENCE", "false").lower() == "false"
          print("production cutover: OFF")
          PY
