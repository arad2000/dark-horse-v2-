name: Auth Quota PostgreSQL Scale

on:
  push:
    branches:
      - integration/hybrid-reconciled
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/darkhorse
  POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
  DARK_HORSE_SHADOW_PERSISTENCE: "false"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"
  SCALE_USER_COUNT: "100"
  SCALE_USER_CREDITS: "10"
  SCALE_REQUESTS: "300"
  SCALE_CONCURRENCY: "30"
  SCALE_WARMUP: "15"
  SCALE_TIMEOUT: "60"
  SCALE_TRIALS: "5"

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        mode: [quota, consume]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkhorse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d darkhorse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and probe dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply Alembic schema
        run: alembic upgrade head

      - name: Run controlled pool sweep
        env:
          SCALE_MODE: ${{ matrix.mode }}
          SCALE_AUTH_FILE: /tmp/darkhorse-scale-users.json
          SCALE_REPLICA_URLS: http://127.0.0.1:8001,http://127.0.0.1:8002,http://127.0.0.1:8003
        run: |
          set -euo pipefail
          mkdir -p artifacts

          start_replicas() {
            rm -f /tmp/darkhorse-api-*.pid /tmp/darkhorse-api-*.log
            for port in 8001 8002 8003; do
              python -m uvicorn main_v2:app --host 127.0.0.1 --port "${port}" > "/tmp/darkhorse-api-${port}.log" 2>&1 &
              echo $! > "/tmp/darkhorse-api-${port}.pid"
            done
            for port in 8001 8002 8003; do
              ready=0
              for i in $(seq 1 45); do
                if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [ "${ready}" -ne 1 ]; then
                echo "Replica ${port} failed to start"
                cat "/tmp/darkhorse-api-${port}.log" || true
                exit 1
              fi
            done
          }

          stop_replicas() {
            for pid in /tmp/darkhorse-api-*.pid; do
              if test -f "${pid}"; then
                kill "$(cat "${pid}")" || true
              fi
            done
            sleep 1
          }

          orders=( "2 5 10" "10 2 5" "5 10 2" "2 10 5" "5 2 10" )
          for trial in $(seq 1 "${SCALE_TRIALS}"); do
            read -r -a pool_order <<< "${orders[$((trial - 1))]}"
            echo "=== balanced pool order trial=${trial}: ${pool_order[*]} ==="
            for pool in "${pool_order[@]}"; do
              export DB_POOL_SIZE="${pool}"
              export SCALE_RESET_DB=true
              python tools/seed_quota_scale_db.py
              start_replicas

              output="artifacts/auth-quota-${{ matrix.mode }}-pool-${pool}-trial-${trial}.json"
              python tools/quota_db_scale_probe.py | tee "${output}"

              stop_replicas
            done
          done

      - name: Summarize repeated trials
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          from pathlib import Path

          mode = "${{ matrix.mode }}"
          trials = int(os.environ["SCALE_TRIALS"])
          orders = ["2 5 10", "10 2 5", "5 10 2", "2 10 5", "5 2 10"]
          summary = {"mode": mode, "trials_per_pool": trials, "trial_orders": orders[:trials], "pools": {}}

          for pool in (2, 5, 10):
              rows = []
              for trial in range(1, trials + 1):
                  path = Path("artifacts") / f"auth-quota-{mode}-pool-{pool}-trial-{trial}.json"
                  rows.append(json.loads(path.read_text(encoding="utf-8")))

              summary["pools"][str(pool)] = {
                  "trials": [row["rps"] for row in rows],
                  "rps_mean": round(statistics.fmean(row["rps"] for row in rows), 2),
                  "rps_median": round(statistics.median(row["rps"] for row in rows), 2),
                  "p50_median_ms": round(statistics.median(row["latency_ms"]["p50"] for row in rows), 2),
                  "p95_median_ms": round(statistics.median(row["latency_ms"]["p95"] for row in rows), 2),
                  "p99_median_ms": round(statistics.median(row["latency_ms"]["p99"] for row in rows), 2),
                  "min_success_rate": min(row["success_rate"] for row in rows),
              }

          Path(f"artifacts/auth-quota-{mode}-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: auth-quota-postgresql-scale-${{ matrix.mode }}-repeated
          path: artifacts/auth-quota-${{ matrix.mode }}-*.json
