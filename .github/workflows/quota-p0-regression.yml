name: P0 Quota Consumption Regression

on:
  push:
    branches:
      - deploy/liara-commercial-sandbox
  pull_request:
    branches:
      - deploy/liara-commercial-sandbox
      - main

jobs:
  quota-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dark_horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_horse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dark_horse_test
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
      BILLING_PROVIDER: mock
      OTP_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify Liara startup command contract
        run: python -m unittest -v test_liara_startup_contract.py
      - name: Verify profile UX contract
        run: python -m unittest -v test_profile_ux_contract.py
      - name: Apply PostgreSQL schema
        run: alembic upgrade head
      - name: Run P0 quota regression
        run: python -m unittest -v test_p0_quota_consumption.py
      - name: Confirm production cutover remains disabled
        run: |
          test "$POSTGRES_RUNTIME_CUTOVER_APPROVED" = "false"
          test "$DARK_HORSE_SHADOW_PERSISTENCE" = "false"
