name: Password Reset Audit

on:
  push:
    branches:
      - deploy/liara-commercial-sandbox
  pull_request:
    branches:
      - deploy/liara-commercial-sandbox

jobs:
  password-reset-contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./password_reset_contract.db
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      DARK_HORSE_SHADOW_PERSISTENCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run password reset service tests
        run: python -m unittest -v test_password_reset_service.py
      - name: Run password reset contract
        run: python -m unittest -v test_password_reset_contract.py
