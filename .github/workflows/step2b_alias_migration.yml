name: Step 2b Table5 Alias Migration

on:
  push:
    branches:
      - feat/record-table5-aliases-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/record-table5-aliases-v2
          fetch-depth: 0

      - name: Apply verified aliases and remap unresolved savabegh
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          programs_path = root / "program2s.json"
          table_path = root / "docs" / "sanjesh_table5_major_bomi_v1.json"
          majors_path = root / "majors_database_v2.json"

          table = json.loads(table_path.read_text(encoding="utf-8"))
          programs_doc = json.loads(programs_path.read_text(encoding="utf-8"))
          majors = json.loads(majors_path.read_text(encoding="utf-8"))

          aliases = {
              "مهندسی صنایع": "مهندسی صنایع و سیستم ها",
              "مهندسی مواد و متالورژی": "مهندسی و علم مواد",
              "مهندسی مواد": "مهندسی و علم مواد",
          }
          table.setdefault("name_aliases", {}).update(aliases)

          def norm(value):
              return (
                  str(value or "")
                  .normalize("NFKC")
                  .replace("ي", "ی")
                  .replace("ى", "ی")
                  .replace("ك", "ک")
                  .replace("‌", " ")
              )
          
          import re
          def canonical(value):
              return re.sub(r"\s+", " ", norm(value)).strip()

          id_name = {
              str(item.get("id")): str(item.get("name") or "").strip()
              for item in majors
              if isinstance(item, dict) and item.get("id") is not None and item.get("name")
          }

          daily = table.get("daily_major_bomi", {})
          lookup = {canonical(k): v for k, v in daily.items()}
          for alias, target in table["name_aliases"].items():
              if target in daily:
                  lookup[canonical(alias)] = daily[target]

          before_unresolved = 0
          after_unresolved = 0
          changed = 0

          for item in programs_doc["programs"]:
              admission = item.get("admission_info") or {}
              if admission.get("method") != "سوابق تحصیلی":
                  continue
              if admission.get("course_type") != "savabegh_dolati":
                  continue

              if admission.get("bomi_type") is None:
                  before_unresolved += 1

              if admission.get("bomi_type") is None:
                  major_name = id_name.get(str(item.get("major_id")))
                  mapped = lookup.get(canonical(major_name)) if major_name else None
                  if mapped:
                      admission["bomi_type"] = mapped
                      admission["bomi_type_rule"] = "table5.daily_major_bomi"
                      changed += 1

              if admission.get("bomi_type") is None:
                  after_unresolved += 1

          regressions = {}
          for program_id in ("PROG_03158", "PROG_01000", "PROG_01029"):
              match = next(
                  (p for p in programs_doc["programs"] if p.get("program_id") == program_id),
                  None,
              )
              regressions[program_id] = (
                  (match or {}).get("admission_info", {}).get("bomi_type")
              )

          assert regressions == {
              "PROG_03158": "nahiyei",
              "PROG_01000": "nahiyei",
              "PROG_01029": "ghotbi",
          }, regressions

          programs_path.write_text(
              json.dumps(programs_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          table_path.write_text(
              json.dumps(table, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"UNRESOLVED_BEFORE={before_unresolved}")
          print(f"UNRESOLVED_AFTER={after_unresolved}")
          print(f"CHANGED={changed}")
          print("ALIASES=" + json.dumps(aliases, ensure_ascii=False))
          print("REGRESSION=" + json.dumps(regressions, ensure_ascii=False))
          PY

      - name: Commit migration result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program2s.json docs/sanjesh_table5_major_bomi_v1.json
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git commit -m "Step 2b: apply verified Table 5 major aliases"
          git push origin HEAD:feat/record-table5-aliases-v2
