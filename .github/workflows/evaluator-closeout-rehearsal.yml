name: Evaluator Closeout Rehearsal

on:
  push:
    branches:
      - hardening/evaluator-closeout
  pull_request:
    branches:
      - deploy/liara-commercial-sandbox

jobs:
  staging-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dark_horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_horse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_RUNTIME_CUTOVER_APPROVED: "false"
      APP_ENV: staging
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create isolated rehearsal databases
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          for db in dark_horse_migration_rehearsal dark_horse_restore_rehearsal dark_horse_concurrency_rehearsal; do
            createdb -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" "$db"
          done

      - name: Run Alembic migration rehearsal
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_migration_rehearsal
        run: python scripts/migration_rehearsal.py --confirm-staging

      - name: Prepare source schema for backup rehearsal
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_test
        run: alembic upgrade head

      - name: Run backup and restore rehearsal
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_test
          RESTORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_restore_rehearsal
        run: python scripts/backup_restore_rehearsal.py --confirm-staging

      - name: Run DB pool concurrency rehearsal
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_test
        run: python scripts/db_pool_concurrency_rehearsal.py --confirm-staging --workers 20 --requests 100

      - name: Prepare concurrency schema
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_concurrency_rehearsal
        run: alembic upgrade head && python seed_reference_data.py --confirm-staging

      - name: Run business credit concurrency rehearsal
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_concurrency_rehearsal
        run: python scripts/billing_concurrency_rehearsal.py --confirm-staging --credits 20 --workers 20

      - name: Verify runtime cutover remains OFF
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dark_horse_test
        run: python hybrid_gate_test.py
