<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>پنل مدیریت | اسب سیاه</title><style>body{margin:0;background:#0a0a0f;color:#eee;font-family:system-ui,sans-serif;padding:20px}.wrap{max-width:920px;margin:auto}.head,.panel{background:#161622;border:1px solid rgba(212,175,55,.18);border-radius:18px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.3);margin-bottom:14px}.head h1{margin:0;color:#f0c040}.sub{color:#b0a080;font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#10101a;border:1px solid #29293a;border-radius:14px;padding:14px}.metric .n{font-size:1.5rem;font-weight:800;color:#f0c040}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid #29293a;font-size:.86rem}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;background:#f0c040;color:#0a0a0f;font-weight:700}.muted{color:#9a927e}.error{color:#ff8f8f;min-height:1.4em}.hide{display:none}</style></head><body><div class="wrap"><section class="head"><h1>پنل مدیریت اسب سیاه</h1><div id="who" class="sub">در حال بررسی دسترسی…</div></section><section id="app" class="hide"><div class="panel"><h2>خلاصه</h2><div id="metrics" class="grid"></div></div><div class="panel"><h2>اعطای اعتبار</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="muted" for="grant-user-id">شناسه عددی کاربر</label><input id="grant-user-id" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" placeholder="مثلاً 123" style="width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:10px;border:1px solid #29293a;background:#10101a;color:#eee;font:inherit"></div><div><label class="muted" for="grant-plan">plan_code</label><input id="grant-plan" value="pack_3_tests" maxlength="64" style="width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:10px;border:1px solid #29293a;background:#10101a;color:#eee;font:inherit;direction:ltr;text-align:left"></div></div><div style="margin-top:10px"><label class="muted" for="grant-reason">دلیل</label><input id="grant-reason" value="هدیه مالک" maxlength="1000" style="width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:10px;border:1px solid #29293a;background:#10101a;color:#eee;font:inherit"></div><div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button id="grant-btn" type="button">اعطا</button><span id="grant-msg" class="muted"></span></div></div><div class="panel"><h2>کاربران اخیر</h2><div class="table-wrap"><table><thead><tr><th>شناسه / user_id</th><th>شناسه عمومی</th><th>نام</th><th>موبایل</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="panel"><h2>بازخوردهای اخیر</h2><div class="table-wrap"><table><thead><tr><th>زمان</th><th>امتیاز رضایت</th><th>دقت</th><th>پیشنهاد می‌کند</th><th>نظر</th></tr></thead><tbody id="feedback"></tbody></table></div></div></section><section id="error" class="panel error"></section></div><script>(async function(){'use strict';var API='https://api.asbe-siah.ir';var auth=null;try{auth=JSON.parse(localStorage.getItem('dh_auth_v1')||'null')}catch(_){auth=null}function req(path){return fetch(API+path,{headers:{Authorization:'Bearer '+(auth&&auth.token||'')}}).then(async r=>{var b=null;try{b=await r.json()}catch(_){}if(!r.ok)throw new Error((b&&(b.detail||b.message))||('خطا '+r.status));return b})}function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]})}try{if(!auth||!auth.token)throw new Error('ورود مدیریتی لازم است.');var me=await req('/api/v1/me');var role=me&&me.user&&me.user.role;if(role!=='admin'&&role!=='support')throw new Error('دسترسی پنل مدیریت برای این حساب مجاز نیست.');document.getElementById('who').textContent='کاربر: '+(me.user.name||'—')+' · نقش: '+role;document.getElementById('app').classList.remove('hide');var data=await Promise.all([req('/api/v1/admin/dashboard'),req('/api/v1/admin/users?limit=50'),req('/api/v1/admin/feedback?limit=50')]);var d=data[0]||{};document.getElementById('metrics').innerHTML=Object.keys(d).map(function(k){return '<div class="metric"><div class="n">'+esc(d[k])+'</div><div class="muted">'+esc(k)+'</div></div>'}).join('');document.getElementById('users').innerHTML=(data[1]||[]).map(function(u){var uid=u&&u.user_id!=null?u.user_id:(u&&u.id!=null?u.id:(u&&u.userId!=null?u.userId:''));var safeUid=esc(uid);return '<tr><td><div style="display:flex;gap:6px;align-items:center;direction:ltr;justify-content:flex-start"><code class="uid-code" style="user-select:text">'+safeUid+'</code>'+(uid!==''?'<button type="button" class="copy-user-id" data-user-id="'+safeUid+'" style="padding:6px 9px">کپی</button>':'')+'</div></td><td>'+esc(u.public_id)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.phone)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.status)+'</td><td>'+(uid!==''?'<button type="button" class="pick-grant" data-user-id="'+safeUid+'" style="padding:7px 10px">اعطا</button>':'—')+'</td></tr>'}).join('')||'<tr><td colspan="7">داده‌ای موجود نیست.</td></tr>';document.getElementById('feedback').innerHTML=(data[2]||[]).map(function(f){return '<tr><td>'+esc(f.created_at)+'</td><td>'+esc(f.satisfaction_score)+'</td><td>'+esc(f.accuracy_rating)+'</td><td>'+esc(f.would_recommend)+'</td><td>'+esc(f.comments)+'</td></tr>'}).join('')||'<tr><td colspan="5">داده‌ای موجود نیست.</td></tr>';var grantUser=document.getElementById('grant-user-id'),grantPlan=document.getElementById('grant-plan'),grantReason=document.getElementById('grant-reason'),grantBtn=document.getElementById('grant-btn'),grantMsg=document.getElementById('grant-msg');function setGrantMessage(message,ok){grantMsg.textContent=message||'';grantMsg.style.color=ok?'#9fe3a2':'#ff8f8f';}function bindUserActions(){document.querySelectorAll('.pick-grant').forEach(function(btn){btn.addEventListener('click',function(){grantUser.value=btn.getAttribute('data-user-id')||'';setGrantMessage('شناسه برای اعطا انتخاب شد.',true);grantUser.focus();try{grantUser.scrollIntoView({behavior:'smooth',block:'center'});}catch(_){} });});document.querySelectorAll('.copy-user-id').forEach(function(btn){btn.addEventListener('click',async function(){var id=btn.getAttribute('data-user-id')||'';try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(id);}else{var ta=document.createElement('textarea');ta.value=id;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}btn.textContent='کپی شد';setTimeout(function(){btn.textContent='کپی';},1200);}catch(_){setGrantMessage('کپی خودکار ممکن نشد؛ عدد را دستی انتخاب کنید.',false);}});});}bindUserActions();if(grantBtn)grantBtn.onclick=async function(){var userId=Number(grantUser.value||0),plan=(grantPlan.value||'').trim()||'pack_3_tests',reason=(grantReason.value||'').trim()||'هدیه مالک';if(!Number.isInteger(userId)||userId<=0){setGrantMessage('شناسه کاربر باید یک عدد صحیح مثبت باشد.',false);grantUser.focus();return;}grantBtn.disabled=true;grantBtn.textContent='در حال اعطا…';setGrantMessage('',true);try{var rr=await fetch(API+'/api/v1/admin/credits/grant',{method:'POST',headers:{Authorization:'Bearer '+(auth&&auth.token||''),'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,plan_code:plan,reason:reason})});var bb=null;try{bb=await rr.json()}catch(_){}if(!rr.ok)throw new Error((bb&&(bb.detail||bb.message))||('خطا '+rr.status));var granted=Number(bb&&bb.credits_granted||0),target=Number(bb&&bb.user_id||userId);setGrantMessage(granted>0?granted+' اعتبار به کاربر '+target+' اضافه شد.':'اعطای اعتبار با موفقیت ثبت شد.',true);grantUser.value='';}catch(e){setGrantMessage(e&&e.message?e.message:'اعطای اعتبار ناموفق بود.',false);}finally{grantBtn.disabled=false;grantBtn.textContent='اعطا';}}}catch(e){document.getElementById('error').textContent=e&&e.message?e.message:'خطای دسترسی'}})();</script></body></html>
