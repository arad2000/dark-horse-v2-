<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>پنل مدیریت | اسب سیاه</title>
<style>body{margin:0;background:#0a0a0f;color:#eee;font-family:Vazirmatn,system-ui,sans-serif;padding:20px}.wrap{max-width:920px;margin:auto}.head,.panel{background:#161622;border:1px solid rgba(212,175,55,.18);border-radius:18px;padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.3);margin-bottom:14px}.head h1{margin:0;color:#f0c040}.sub{color:#b0a080;font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#10101a;border:1px solid #29293a;border-radius:14px;padding:14px}.metric .n{font-size:1.5rem;font-weight:800;color:#f0c040}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid #29293a;font-size:.86rem}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;background:#f0c040;color:#0a0a0f;font-weight:700}.muted{color:#9a927e}.error{color:#ff8f8f;min-height:1.4em}.ok{color:#8fe0a8}.hide{display:none}</style>
</head>
<body><div class="wrap"><section class="head"><h1>پنل مدیریت اسب سیاه</h1><div id="who" class="sub">در حال بررسی دسترسی…</div></section><section id="app" class="hide"><div class="panel"><h2>خلاصه</h2><div id="metrics" class="grid"></div></div><div class="panel"><h2>کاربران اخیر</h2><div class="table-wrap"><table><thead><tr><th>شناسه عمومی</th><th>نام</th><th>موبایل</th><th>نقش</th><th>وضعیت</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="panel"><h2>بازخوردهای اخیر</h2><div class="table-wrap"><table><thead><tr><th>زمان</th><th>امتیاز رضایت</th><th>دقت</th><th>پیشنهاد می‌کند</th><th>نظر</th></tr></thead><tbody id="feedback"></tbody></table></div></div></section><section id="error" class="panel error"></section></div>
<script>
(async function(){
'use strict';
var API='https://api.asbe-siah.ir';
var auth=null;
try{auth=JSON.parse(localStorage.getItem('dh_auth_v1')||'null')}catch(_){auth=null}
function req(path){return fetch(API+path,{headers:{Authorization:'Bearer '+(auth&&auth.token||'')}}).then(async r=>{var b=null;try{b=await r.json()}catch(_){}if(!r.ok)throw new Error((b&&(b.detail||b.message))||('خطا '+r.status));return b})}
function text(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]})}
try{
if(!auth||!auth.token)throw new Error('ورود مدیریتی لازم است.');
var me=await req('/api/v1/me');
var role=me&&me.user&&me.user.role;
if(role!=='admin'&&role!=='support')throw new Error('دسترسی پنل مدیریت برای این حساب مجاز نیست.');
document.getElementById('who').textContent='کاربر: '+(me.user.name||'—')+' · نقش: '+role;
document.getElementById('app').classList.remove('hide');
var data=await Promise.all([req('/api/v1/admin/dashboard'),req('/api/v1/admin/users?limit=50'),req('/api/v1/admin/feedback?limit=50')]);
var d=data[0]||{};document.getElementById('metrics').innerHTML=Object.keys(d).map(function(k){return '<div class="metric"><div class="n">'+text(d[k])+'</div><div class="muted">'+text(k)+'</div></div>'}).join('');
document.getElementById('users').innerHTML=(data[1]||[]).map(function(u){return '<tr><td>'+text(u.public_id)+'</td><td>'+text(u.name)+'</td><td>'+text(u.phone)+'</td><td>'+text(u.role)+'</td><td>'+text(u.status)+'</td></tr>'}).join('')||'<tr><td colspan="5">داده‌ای موجود نیست.</td></tr>';
document.getElementById('feedback').innerHTML=(data[2]||[]).map(function(f){return '<tr><td>'+text(f.created_at)+'</td><td>'+text(f.satisfaction_score)+'</td><td>'+text(f.accuracy_rating)+'</td><td>'+text(f.would_recommend)+'</td><td>'+text(f.comments)+'</td></tr>'}).join('')||'<tr><td colspan="5">داده‌ای موجود نیست.</td></tr>';
}catch(e){document.getElementById('error').textContent=e&&e.message?e.message:'خطای دسترسی';}
})();
</script></body></html>
