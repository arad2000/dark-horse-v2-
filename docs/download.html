<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دانلود اپ اسب سیاه</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --gold:#c9a227; --text:#f0e6d3; --muted:#9aa3b2; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Tahoma, "Vazirmatn", sans-serif;
      background: radial-gradient(ellipse at top, #1a2332 0%, var(--bg) 55%);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid rgba(201,162,39,.35); border-radius: 16px;
      padding: 28px 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; color: var(--gold); }
    .ver { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
    .btn {
      display: block; width: 100%; padding: 14px 18px; margin: 10px 0;
      border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 1rem;
      border: none; cursor: pointer;
    }
    .btn-primary { background: var(--gold); color: #1a1200; }
    .btn-secondary { background: transparent; color: var(--gold); border: 1px solid rgba(201,162,39,.5); }
    .note { font-size: .8rem; color: var(--muted); margin-top: 16px; line-height: 1.6; }
    a.home { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>اسب سیاه · هدایت تحصیلی</h1>
    <p class="ver">نسخه ۱.۰.۵ · نصب مستقیم اندروید</p>
    <a class="btn btn-primary" href="/asbe-siah-1.0.5.apk" download="asbe-siah-1.0.5.apk">
      دانلود اپلیکیشن (APK)
    </a>
    <a class="btn btn-secondary" href="https://cafebazaar.ir" rel="noopener">
      جستجو در کافه بازار: اسب سیاه هدایت تحصیلی
    </a>
    <p class="note">
      پس از دانلود روی فایل بزنید و نصب کنید.
      اگر گوشی هشدار «منبع ناشناس» داد، یک‌بار اجازه نصب از فایل را فعال کنید.
      این نسخه روی نسخه‌های قبلی نصب می‌شود.
    </p>
    <p><a class="home" href="/">بازگشت به سایت</a></p>
  </div>
</body>
</html>
