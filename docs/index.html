    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin:15px 0}@media(min-width:420px){.grid{grid-template-columns:1fr 1fr}} .option{background:var(--bg-card);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:15px 12px;cursor:pointer;text-align:right;transition:all .2s;color:#e6e0d2}.option.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);color:var(--accent)}.option-icon{font-size:1.8rem;display:block;margin-bottom:4px}
    .progress-bar{width:100%;height:6px;background:#2a2a3e;border-radius:4px;margin:10px 0}.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}

  <script>
    (function () {
      'use strict';
      window.__dhRequestStartupJourney = function () {
        window.__dhStartupLaunchQueued = true;
        var button = document.getElementById('dh-startup-start');
        if (button) {
          button.disabled = true;
          button.textContent = 'در حال آماده‌سازی سفر…';
        }
        function launchAfterBoot() {
          setTimeout(function () {
            if (!window.__dhStartupLaunchQueued) return;
            if (!window.DHCommercialUI || typeof window.DHCommercialUI.startServerAuthorizedJourney !== 'function') {
              if (button) {
                button.disabled = false;
                button.textContent = 'شروع سفر';
              }
              window.__dhStartupLaunchQueued = false;
              return;
            }
            window.__dhStartupLaunchQueued = false;
            window.DHCommercialUI.startServerAuthorizedJourney();
          }, 0);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', launchAfterBoot, { once: true });
        } else {
          launchAfterBoot();
        }
      };
      window.__dhRequestStartupSanjesh = function () {
        window.__dhStartupSanjeshQueued = true;
        var button = document.getElementById('dh-startup-open-sanjesh');
        if (button) {
          button.disabled = true;
          button.textContent = 'در حال آماده‌سازی بخش سنجش…';
        }
        function openAfterBoot() {
          setTimeout(function () {
            if (!window.__dhStartupSanjeshQueued) return;
            if (!window.DHShell || typeof window.DHShell.openSanjesh !== 'function') {
              if (button) {
                button.disabled = false;
                button.textContent = 'ورود به بخش سنجش';
              }
              window.__dhStartupSanjeshQueued = false;
              return;
            }
            window.__dhStartupSanjeshQueued = false;
            window.DHShell.openSanjesh();
          }, 0);
        }
        if (document.readyState !== 'complete') {
          document.addEventListener('DOMContentLoaded', openAfterBoot, { once: true });
        } else {
          openAfterBoot();
        }
      };
    })();
  </script>
