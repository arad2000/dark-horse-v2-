    :root { --bg-primary:#0e1017; --bg-card:#171a25; --accent:#f0c040; --accent-dim:#d4af37; --text-primary:#f5efe2; --text-secondary:#b8b2a4; --font-main:'Vazirmatn',sans-serif; --radius-sm:8px; --radius-md:14px; --shadow-card:0 6px 24px rgba(0,0,0,.35); --shadow-glow:0 0 20px rgba(240,192,64,.25); }
    *{box-sizing:border-box;margin:0;padding:0} html{width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none} body{font-family:var(--font-main);background:var(--bg-primary);color:var(--text-primary);width:100%;max-width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;user-select:none;-webkit-tap-highlight-color:transparent}
    .container{max-width:min(480px,100%);width:100%;min-width:0;padding:20px 14px;text-align:center;overflow-x:clip} h1{font-size:1.8rem;color:var(--accent);margin-bottom:8px} h2{font-size:1.4rem;color:var(--accent-dim);margin:15px 0 10px} p{line-height:2;margin-bottom:12px;color:var(--text-primary);font-size:.95rem}.quote{font-style:italic;color:var(--text-secondary);margin:15px 0;border-right:3px solid var(--accent-dim);padding-right:12px}
    .card{background:var(--bg-card);border:1px solid rgba(212,175,55,.15);border-radius:var(--radius-md);padding:25px 18px;margin:15px 0;box-shadow:var(--shadow-card)}
    .btn{display:inline-block;padding:12px 28px;border:none;border-radius:50px;font-family:inherit;font-size:.95rem;cursor:pointer;transition:all .25s;background:#2a2a42;color:#e0e0e0;box-shadow:0 4px 12px rgba(0,0,0,.4);margin:6px}.btn-primary{background:var(--accent);color:var(--bg-primary);font-weight:bold;box-shadow:0 4px 15px rgba(240,192,64,.3)}.btn-heart{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:var(--bg-primary);font-weight:bold;font-size:1.1rem;padding:14px 32px;box-shadow:0 4px 15px rgba(240,192,64,.3)}.btn-skip{background:transparent;color:#888;border:1px solid #333;padding:12px 24px;border-radius:var(--radius-sm);width:100%;margin-top:8px;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin:15px 0}@media(min-width:420px){.grid{grid-template-columns:1fr 1fr}} .option{background:var(--bg-card);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:15px 12px;cursor:pointer;text-align:right;transition:all .2s;color:#ccc}.option.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);color:var(--accent)}.option-icon{font-size:1.8rem;display:block;margin-bottom:4px}
    .progress-bar{width:100%;height:6px;background:#2a2a3e;border-radius:4px;margin:10px 0}.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}
    .swipe-card{background:var(--bg-card);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:24px;margin:16px 0;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .warning{background:rgba(240,192,64,.05);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:12px;margin-top:12px;color:var(--accent);font-size:.85rem}.hidden{display:none!important}
    .btn-heart.dh-pulse,.btn-skip.dh-pulse{animation:dhBtnPulse .38s ease;pointer-events:none}@keyframes dhBtnPulse{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}.swipe-card.dh-card-swap{animation:dhCardFade .28s ease}@keyframes dhCardFade{0%{opacity:.4;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
    .dh-motive-count{display:inline-block;margin:8px 0 4px;padding:5px 12px;border-radius:999px;font-size:.8rem;background:rgba(240,192,64,.12);border:1px solid rgba(240,192,64,.35);color:#f0c040}

  <script>
    (function () {
      'use strict';
      window.__dhRequestStartupJourney = function () {
        window.__dhStartupLaunchQueued = true;
        var button = document.getElementById('dh-startup-start');
        if (button) {
          button.disabled = true;
          button.textContent = 'در حال آماده‌سازی سفر…';
        }
        function launchAfterBoot() {
          setTimeout(function () {
            if (!window.__dhStartupLaunchQueued) return;
            if (!window.DHCommercialUI || typeof window.DHCommercialUI.startServerAuthorizedJourney !== 'function') {
              if (button) {
                button.disabled = false;
                button.textContent = 'شروع سفر';
              }
              window.__dhStartupLaunchQueued = false;
              return;
            }
            window.__dhStartupLaunchQueued = false;
            window.DHCommercialUI.startServerAuthorizedJourney();
          }, 0);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', launchAfterBoot, { once: true });
        } else {
          launchAfterBoot();
        }
      };
      window.__dhRequestStartupSanjesh = function () {
        window.__dhStartupSanjeshQueued = true;
        var button = document.getElementById('dh-startup-open-sanjesh');
        if (button) {
          button.disabled = true;
          button.textContent = 'در حال آماده‌سازی بخش سنجش…';
        }
        function openAfterBoot() {
          setTimeout(function () {
            if (!window.__dhStartupSanjeshQueued) return;
            if (!window.DHShell || typeof window.DHShell.openSanjesh !== 'function') {
              if (button) {
                button.disabled = false;
                button.textContent = 'ورود به بخش سنجش';
              }
              window.__dhStartupSanjeshQueued = false;
              return;
            }
            window.__dhStartupSanjeshQueued = false;
            window.DHShell.openSanjesh();
          }, 0);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', openAfterBoot, { once: true });
        } else {
          openAfterBoot();
        }
      };
    })();
