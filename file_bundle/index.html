<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بستهٔ فایل‌های اصلاحی</title>
<style>
body{margin:0;padding:16px 14px 90px;background:#0a0a0f;color:#eee;font-family:system-ui,sans-serif;line-height:1.9;-webkit-text-size-adjust:100%}
h1{font-size:1.15rem;color:#f0c040;margin:0 0 6px}
p{font-size:.85rem;color:#b0a080;margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:16px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid #23233a}
th{color:#b0a080;font-weight:600}
.mono{direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:.72rem;word-break:break-all}
button{background:#f0c040;color:#0a0a0f;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:.85rem;min-height:44px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px;background:rgba(10,10,15,.96);border-top:1px solid #23233a;backdrop-filter:blur(6px)}
#bar button{width:100%;font-size:1rem;min-height:50px}
button.g{background:#29293a;color:#eee;border:1px solid rgba(212,175,55,.25)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ok{color:#8fe0a8;font-size:.78rem}
.hide{display:none}
pre{background:#10101a;border:1px solid #29293a;border-radius:8px;padding:10px;font-size:.7rem;overflow:auto;max-height:200px;direction:ltr;text-align:left}
</style>
</head>
<body>
<h1>بستهٔ فایل‌های اصلاحی</h1>
<p id="status">در حال آماده‌سازی…</p>

<div id="app" class="hide">
  <div class="row">
    <button class="g" id="toggle">نمایش لیست فایل‌ها</button>
  </div>

  <table>
    <thead><tr><th>فایل</th><th>حجم</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <pre id="detail" class="hide"></pre>
</div>

<div id="bar" class="hide"><button id="dl-all">دانلود بستهٔ کامل (ZIP)</button></div>

<script>
(function(){
  'use strict';
  var FILES = window.__FILES__ || [];
  var el = function(id){ return document.getElementById(id); };

  function b64ToBlob(b64){
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], {type:'application/octet-stream'});
  }

  function download(name, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  // Minimal ZIP writer (store only, no compression) so one tap gets everything.
  function crc32(bytes){
    var table = crc32.table;
    if (!table){
      table = crc32.table = new Uint32Array(256);
      for (var i=0;i<256;i++){
        var c=i;
        for (var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
        table[i]=c>>>0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var j=0;j<bytes.length;j++) crc = (crc>>>8) ^ table[(crc ^ bytes[j]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(entries){
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;
    entries.forEach(function(e){
      var nameBytes = enc.encode(e.path);
      var crc = crc32(e.bytes);
      var size = e.bytes.length;

      var local = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);   // UTF-8 names
      dv.setUint16(8, 0, true);        // store
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      parts.push(local, e.bytes);

      var cd = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += local.length + size;
    });

    var centralSize = central.reduce(function(a,c){ return a + c.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob(parts.concat(central, [end]), {type:'application/zip'});
  }

  function init(){
    if (!FILES.length){
      el('status').textContent = 'داده‌ای بارگذاری نشد. فایل data.js را درست آپلود کرده‌اید؟';
      return;
    }
    el('status').textContent = FILES.length + ' فایل آماده است.';
    el('app').classList.remove('hide');
    el('bar').classList.remove('hide');

    var tbody = el('rows');
    FILES.forEach(function(f){
      var tr = document.createElement('tr');
      var tdName = document.createElement('td');
      tdName.className = 'mono';
      tdName.textContent = f.path;
      var tdSize = document.createElement('td');
      tdSize.textContent = Math.round(f.size/1024) + ' KB';
      var tdBtn = document.createElement('td');
      var b = document.createElement('button');
      b.textContent = 'دانلود';
      b.onclick = function(){
        download(f.path.split('/').pop(), b64ToBlob(f.b64));
        el('status').textContent = 'دانلود شد: ' + f.path.split('/').pop();
      };
      tdBtn.appendChild(b);
      tr.appendChild(tdName); tr.appendChild(tdSize); tr.appendChild(tdBtn);
      tbody.appendChild(tr);
    });

    el('dl-all').onclick = function(){
      try {
        var entries = FILES.map(function(f){
          var bin = atob(f.b64), bytes = new Uint8Array(bin.length);
          for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
          return { path: f.path, bytes: bytes };
        });
        download('referral-files.zip', makeZip(entries));
        el('status').textContent = 'ZIP دانلود شد.';
      } catch (e) {
        el('status').textContent = 'خطا در ساخت ZIP: ' + e.message;
      }
    };

    el('toggle').onclick = function(){
      var d = el('detail');
      d.classList.toggle('hide');
      if (!d.textContent) d.textContent = FILES.map(function(f){ return f.path; }).join('\n');
    };
  }

  init();
})();
</script>
<script src="data.js"></script>
</body>
</html>
